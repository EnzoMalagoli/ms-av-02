global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'login-seguranca'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      # Prometheus rodando no Docker e a aplicação rodando na sua máquina (porta 8080).
      # Se rodar o Prometheus instalado direto na máquina (sem Docker), troque por "localhost:8080".
      - targets: ["host.docker.internal:8080"]
